<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

  <!-- REQUIRED MiniApp embed metadata -->
  <meta name="fc:miniapp" content='{
    "version": "next",
    "imageUrl": "https://ik.imagekit.io/defidrey/BaseMaze/BsmzPfp.jpg",
    "button": {
      "title": "Play Now",
      "action": {
        "type": "launch_miniapp",
        "name": "BaseMaze",
        "url": "https://basemazee.vercel.app"
      }
    }
  }' />

  <!-- Minimal safe CSP for Unity + Farcaster -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://miniapps.farcaster.xyz;
    connect-src 'self' https://*.vercel.app https://miniapps.farcaster.xyz https: blob:;
    img-src 'self' data: blob:;
    style-src 'self' 'unsafe-inline';
    worker-src blob:;
    frame-src *;
  ">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Basemaze (Farcaster Mini-App)</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico" />
  <link rel="stylesheet" href="TemplateData/style.css" />

  <!-- Preload Unity GZIP (.unityweb) -->
  <link rel="preload" href="Build/WebGL.loader.js" as="script" />
  <link rel="preload" href="Build/WebGL.framework.js.unityweb" as="fetch" crossorigin />
  <link rel="preload" href="Build/WebGL.data.unityweb" as="fetch" crossorigin />
  <link rel="preload" href="Build/WebGL.wasm.unityweb" as="fetch" crossorigin />

  <!-- Farcaster Miniapp SDK -->
  <script src="https://miniapps.farcaster.xyz/sdk.umd.js"></script>

  <script>
    // ------------------ Farcaster SDK Boot ------------------
    window.farcaster = null;
    window.__miniappBridge = {};

    function initMiniAppSDK() {
      if (window.FarcasterSDK && !window.farcaster) {
        try {
          window.farcaster = new window.FarcasterSDK();
          console.log("[MiniApp] Farcaster SDK initialized.");
        } catch (e) {
          console.error("[MiniApp] Error initializing Farcaster SDK:", e);
        }
      }
    }

    (function waitForSDK() {
      if (window.FarcasterSDK && !window.farcaster) { initMiniAppSDK(); return; }
      setTimeout(waitForSDK, 200);
    })();

    function safeAction(a, ...args) {
      try {
        const fn = window.farcaster?.actions?.[a];
        if (!fn) return console.warn("[MiniApp] Action not available:", a);
        return fn.apply(window.farcaster.actions, args);
      } catch (e) { console.error(e); }
    }

    window.__miniappBridge.openUrl = u => safeAction("openUrl", u);
    window.__miniappBridge.getUser = () => safeAction("getUser");
    window.__miniappBridge.requestUser = () => safeAction("requestUser");
    window.__miniappBridge.signMessage = m => safeAction("signMessage", m);
    window.__miniappBridge.requestSession = p => safeAction("requestSession", p);
    window.__miniappBridge.close = () => safeAction("close");
    window.__miniappBridge.ready = () => safeAction("ready");

    function sendToUnity(method, payload) {
      if (!window.unityInstance) return;
      window.unityInstance.SendMessage("MiniAppManager", method, payload ?? "");
    }

    (function subscribeWhenReady() {
      if (window.farcaster?.on) {
        ["sessionChanged", "userChanged", "navigate", "signComplete"].forEach(ev => {
          try {
            window.farcaster.on(ev, data => {
              sendToUnity("OnMiniAppEvent", JSON.stringify({ event: ev, data }));
            });
          } catch (e) {}
        });
        return;
      }
      setTimeout(subscribeWhenReady, 250);
    })();
  </script>

</head>
<body>
  <div id="unity-container" class="unity-desktop" style="position:fixed; inset:0;">
    <canvas id="unity-canvas" tabindex="-1" style="width:100%; height:100%; display:block;"></canvas>

    <div id="unity-loading-bar" style="position:absolute; top:10px; left:10px; z-index:1000;">
      <div id="unity-loading-text">Loading...</div>
      <div id="unity-progress-bar-empty" style="width:220px; height:8px; background:#333;">
        <div id="unity-progress-bar-full" style="width:0%; height:100%; background:#4caf50;"></div>
      </div>
      <div id="unity-progress-text">0%</div>
    </div>

    <div id="unity-warning" style="position:absolute; bottom:10px; left:10px; z-index:1000;"></div>
  </div>

  <script>
    var canvas = document.getElementById("unity-canvas");
    var buildUrl = "Build";

    var config = {
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Basemaze",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      showBanner: function (msg, type) {
        var w = document.getElementById("unity-warning");
        var d = document.createElement("div");
        d.innerText = msg;
        d.style.padding = "8px";
        d.style.margin = "6px";
        d.style.borderRadius = "4px";
        d.style.background = type === "error"
          ? "rgba(200,30,30,0.95)"
          : "rgba(255,210,0,0.95)";
        w.appendChild(d);
        if (type !== "error") setTimeout(() => d.remove(), 6000);
      }
    };

    // Load Unity loader
    var loaderScript = document.createElement("script");
    loaderScript.src = buildUrl + "/WebGL.loader.js";
    loaderScript.crossOrigin = "anonymous";

    loaderScript.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var pct = Math.round(progress * 100);
        document.getElementById("unity-progress-bar-full").style.width = pct + "%";
        document.getElementById("unity-progress-text").textContent = pct + "%";
      })
      .then(function (instance) {
        window.unityInstance = instance;
        document.getElementById("unity-loading-bar").style.display = "none";
        safeAction("ready");
      })
      .catch(function (err) {
        console.error("Unity failed:", err);
        config.showBanner("Unity failed: " + err, "error");
      });
    };

    loaderScript.onerror = () =>
      config.showBanner("Failed to load WebGL.loader.js", "error");

    document.body.appendChild(loaderScript);
  </script>

</body>
</html>
