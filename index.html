<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * blob: data:; img-src * blob: data:; style-src 'self' 'unsafe-inline' *; script-src 'unsafe-eval' 'unsafe-inline' *; connect-src *; media-src *"
    />

    <!-- Favicon -->
    <link rel="icon" href="TemplateData/favicon.ico" />

    <!-- Unity Stylesheet -->
    <link rel="stylesheet" href="TemplateData/style.css" />

    <!-- Farcaster Miniapp Metadata -->
    <meta name="fc:frame" content="{" />
    <meta name="fc:beam:version" content="vNext" />

    <title>Base Maze</title>

    <!-- Farcaster Mini App UMD SDK -->
    <script
      src="https://cdn.jsdelivr.net/npm/@farcaster/frame-wrapped-miniapp-bridge-umd"
      defer
      onload="console.log('[Farcaster] UMD SDK loaded');"
    ></script>

    <!-- Global window.farcasterReady() handler -->
    <script>
      // This ensures Unity can call it once fully loaded
      window.farcasterReady = () => {
        if (window.farcasterSDK?.actions?.ready) {
          window.farcasterSDK.actions.ready();
          console.log("[Farcaster] ready() signal sent from farcasterReady()");
        } else {
          console.warn("[Farcaster] SDK not initialized yet");
        }
      };
    </script>
  </head>

  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>

    <!-- Unity Loader Script -->
    <script>
      const unityBuildUrl = "Build";
      const loaderUrl = `${unityBuildUrl}/unity.loader.js`;
      const config = {
        dataUrl: `${unityBuildUrl}/unity.data.unityweb`,
        frameworkUrl: `${unityBuildUrl}/unity.framework.js.unityweb`,
        codeUrl: `${unityBuildUrl}/unity.wasm.unityweb`,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Basemaze",
        productName: "Base Maze",
        productVersion: "1.0",
      };

      const canvas = document.getElementById("unity-canvas");

      // Load Unity Loader
      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        console.log("[Unity] Loader loaded");
        createUnityInstance(canvas, config, (progress) => {
          const progressBar = document.getElementById("unity-progress-bar-full");
          progressBar.style.width = `${progress * 100}%`;
        })
          .then((unityInstance) => {
            window.unityInstance = unityInstance;
            console.log("[Unity] Instance ready");

            document.getElementById("unity-loading-bar").style.display = "none";

            // FINAL CORRECT READY CALL
            window.farcasterReady();
          })
          .catch((err) => {
            console.error("[Unity] Error creating instance:", err);
          });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
