<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <!-- Keep viewport tight to avoid zooming/layout shifts in embedded WebViews -->
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>Unity Web Player | Basemaze</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <!-- Preload -->
  <link rel="preload" href="Build/WebGL.loader.js" as="script">
  <link rel="preload" href="Build/WebGL.framework.js.unityweb" as="fetch" crossorigin>
  <link rel="preload" href="Build/WebGL.data.unityweb" as="fetch" crossorigin>
  <link rel="preload" href="Build/WebGL.wasm.unityweb" as="fetch" crossorigin>

  <!-- Farcaster SDK Loader (unchanged) -->
  <script>
    window.farcasterSDK = null;
    window.farcasterReadySent = false;

    function sendFarcasterReady() {
      if (!window.farcasterSDK?.actions?.ready) return;
      if (window.farcasterReadySent) return;

      window.farcasterReadySent = true;
      window.farcasterSDK.actions.ready();
      console.log("[Farcaster] ready() sent");
    }

    async function loadFarcasterSDK() {
      const ESM = "https://miniapp-sdk.farcaster.xyz/sdk.js";
      const UMD = "https://miniapp-sdk.farcaster.xyz/sdk.umd.js";

      try {
        const module = await import(ESM);
        const SDK = module.FarcasterSDK || module.default;
        window.farcasterSDK = new SDK();
        console.log("[Farcaster] SDK loaded (ESM)");
        return;
      } catch (e) {
        console.warn("[Farcaster] ESM load failed:", e);
      }

      try {
        await new Promise((res, rej) => {
          const s = document.createElement("script");
          s.src = UMD;
          s.onload = res;
          s.onerror = rej;
          document.head.appendChild(s);
        });

        if (window.FarcasterSDK) {
          window.farcasterSDK = new window.FarcasterSDK();
        } else if (window.farcaster) {
          window.farcasterSDK = window.farcaster;
        }

        console.log("[Farcaster] SDK loaded (UMD)");
      } catch (e) {
        console.error("[Farcaster] Failed to load SDK:", e);
      }
    }

    loadFarcasterSDK();
  </script>

  <script src="TemplateData/ready.js"></script>

  <style>
    /* Ensure the canvas occupies the container fully to avoid reflow and context loss */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    #unity-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: black;
    }
    canvas#unity-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      touch-action: none; /* prevent double-tap zoom and scrolling */
      outline: none;
    }
    /* Keep your loading UI visible over canvas */
    #unity-loading-bar { z-index: 9999; }
  </style>
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-loading-text">Loading...</div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-progress-text">0%</div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Basemaze</div>
    </div>
  </div>

  <script>
    // More robust logging for mobile WebViews:
    window.addEventListener("error", e => {
      console.warn("Error:", e.message, e.filename, e.lineno, e.colno);
      // show banner for quick visibility in mini-app
      unityShowBanner("Error: " + (e.message || "unknown error"), "error");
    });
    window.addEventListener("unhandledrejection", e => {
      console.warn("Promise rejection:", e.reason);
      unityShowBanner("Promise rejection: " + String(e.reason), "error");
    });

    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      var div = document.createElement("div");
      div.innerHTML = msg;
      div.style = (type === "error")
        ? "background: rgba(200,30,30,0.95); color: white; padding: 10px; margin: 6px; border-radius: 6px;"
        : "background: rgba(255,210,0,0.95); color: black; padding: 8px; margin: 6px; border-radius: 6px;";
      warningBanner.appendChild(div);
      if (type !== "error") setTimeout(() => div.remove(), 6000);
    }

    // Capability detection: WebGL + WASM
    function supportsWebGL() {
      try {
        const canvas = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
      } catch (e) {
        return false;
      }
    }
    function supportsWasm() {
      return typeof WebAssembly === "object";
    }

    if (!supportsWebGL() || !supportsWasm()) {
      unityShowBanner("This embedded browser does not support WebGL or WebAssembly. Try opening in a full browser.", "error");
      console.warn("Missing WebGL/WASM support:", supportsWebGL(), supportsWasm());
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";

    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Basemaze",
      productVersion: "1.0",
      showBanner: unityShowBanner,
      matchWebGLToCanvasSize: true
      // DO NOT add custom memory keys here — change memory in Unity build settings instead
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
      // keep devicePixelRatio low in embedded webviews
      config.devicePixelRatio = 1;
      // Also try disabling preserveDrawingBuffer for mobile contexts (if set in project)
    }

    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBar = document.querySelector("#unity-progress-bar-full");
    var progressText = document.querySelector("#unity-progress-text");

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.crossOrigin = "anonymous";

    script.onload = () => {
      // Hook into Unity's logging API if possible to surface low-level errors:
      // createUnityInstance returns a Promise which resolves to unityInstance
      createUnityInstance(canvas, config, progress => {
        var percent = Math.floor(progress * 100);
        progressBar.style.width = percent + "%";
        progressText.textContent = percent + "%";
      })
        .then(unityInstance => {
          window.unityInstance = unityInstance;
          loadingBar.style.display = "none";

          // If the loader sets Module, try to funnel its stderr to the banner/console
          try {
            const Module = unityInstance.Module || window.Module;
            if (Module) {
              // If Module.printErr exists, forward errors to our banner for visibility
              if (Module.printErr) {
                const origErr = Module.printErr;
                Module.printErr = function(...args) {
                  console.error(...args);
                  try { unityShowBanner(String(args.join(' ')), "error"); } catch(e) {}
                  return origErr.apply(this, args);
                };
              }
              // Optional: forward normal prints to console (helpful for debug builds)
              if (Module.print) {
                const origPrint = Module.print;
                Module.print = function(...args) {
                  console.log(...args);
                  return origPrint.apply(this, args);
                };
              }
            }
          } catch (e) {
            console.warn("Failed to patch Module logging:", e);
          }

          // Unity loaded → Now safely send Farcaster ready()
          sendFarcasterReady();
        })
        .catch(err => {
          console.error("createUnityInstance failed:", err);
          // Better error messaging: check for likely memory failure text
          const msg = String(err);
          if (/memory|out of memory|Unable to allocate|OOM/i.test(msg)) {
            unityShowBanner("Unity failed to initialize: likely out-of-memory in the embedded browser. Rebuild with lower WebGL memory (Initial 128MB / Max 512MB) and linear growth.", "error");
          } else {
            unityShowBanner("Unity failed: " + msg, "error");
          }
        });
    };

    script.onerror = () => {
      unityShowBanner("Failed to load WebGL.loader.js", "error");
    };

    document.body.appendChild(script);
  </script>

</body>

</html>
